name: Python Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install testing and coverage tools
        run: python -m pip install pytest-cov coverage

      - name: Run tests with coverage details
        run: python -m pytest -vv --cov=src --cov-branch --cov-report=term-missing